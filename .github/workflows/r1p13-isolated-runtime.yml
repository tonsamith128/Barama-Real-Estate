name: R1p13 isolated repository runtime

on:
  pull_request:
    paths:
      - 'tools/r1p13/**'
      - '.github/workflows/r1p13-isolated-runtime.yml'
      - 'application/**'
      - 'index.php'
      - 'VERSION'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-http-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Bash syntax preflight
        run: bash -n tools/r1p13/run-ci.sh
      - name: Execute disposable network-isolated HTTP and auth checks
        run: bash tools/r1p13/run-ci.sh
