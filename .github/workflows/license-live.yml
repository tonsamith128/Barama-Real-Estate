name: Live License Manager QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-license:
    name: Barama live license contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BARAMA_LIVE_DIRECT_LICENSE_KEY: ${{ secrets.BARAMA_LIVE_DIRECT_LICENSE_KEY }}
      BARAMA_LIVE_DIRECT_DOMAIN: ${{ secrets.BARAMA_LIVE_DIRECT_DOMAIN }}
      BARAMA_LIVE_ENVATO_PURCHASE_CODE: ${{ secrets.BARAMA_LIVE_ENVATO_PURCHASE_CODE }}
      BARAMA_LIVE_ENVATO_DOMAIN: ${{ secrets.BARAMA_LIVE_ENVATO_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json, mbstring
          coverage: none

      - name: Run live Ton Samith License Manager QA
        run: php tools/license-live-smoke.php
