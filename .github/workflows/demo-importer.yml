name: Demo Importer
on:
  pull_request:
    paths:
      - 'application/app/Services/DemoImportPackageV1.php'
      - 'tests/demo_import_native_install_v107.php'
      - 'tests/demo_import_status_v108.php'
      - 'tests/demo_import_native_limits_v109.php'
      - 'tests/demo_import_shared_media_v110.php'
      - 'tests/demo_import_media_unique_v111.php'
      - 'application/app/Http/Controllers/DemoImporterController.php'
      - 'application/resources/views/workspace/demo-importer.php'
      - 'assets/js/barama-demo-manual-v104.js'
      - 'assets/js/barama-demo-premium-v103.js'
      - 'assets/css/barama-demo-premium-v103.css'
      - 'assets/css/barama-demo-manual-v104.css'
      - 'assets/css/barama-demo-importer-v100.css'
      - 'application/routes/web.php'
      - 'application/resources/views/layouts/app.php'
      - 'tests/demo_import_package_v100.php'
      - 'tests/demo_publisher_api_v101.php'
      - 'tests/demo_publisher_pin_v102.php'
      - 'tests/demo_publisher_native_archive_v102.php'
      - 'application/app/Services/DemoPublisherNativeArchiveV1.php'
      - 'tests/demo_publisher_download_v101.php'
      - 'tests/demo_publisher_integration_v101.php'
      - 'docs/demo-importer-actual-publisher-api-v101.md'
      - 'application/app/Services/DemoPublisherDownloadV1.php'
      - 'application/app/Services/DemoPublisherApiV1.php'
      - 'tests/demo_import_mysql_v100.php'
      - 'application/app/Services/SystemToolService.php'
      - 'tools/demo-export-source-v100.php'
      - 'tools/demo-package-offline-sign-v100.py'
      - 'docs/demo-importer-publisher-contract-v100.md'
      - '.github/workflows/demo-importer.yml'
  push:
    branches: [main, 'feature/system-demo-importer-*']
jobs:
  signed-demo-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: demo_test_password
          MYSQL_DATABASE: barama_demo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, zip, pdo_mysql, mbstring, fileinfo
          coverage: none
      - name: PHP source syntax
        run: |
          php -l application/app/Services/DemoImportPackageV1.php
          php -l application/app/Http/Controllers/DemoImporterController.php
          php -l application/resources/views/workspace/demo-importer.php
          php -l application/routes/web.php
          php -l application/resources/views/layouts/app.php
          php -l tests/demo_import_package_v100.php
          php -l tests/demo_publisher_api_v101.php
          php -l tests/demo_publisher_pin_v102.php
          php -l tests/demo_publisher_native_archive_v102.php
          php -l application/app/Services/DemoPublisherNativeArchiveV1.php
          php -l tests/demo_publisher_download_v101.php
          php -l tests/demo_publisher_integration_v101.php
          php -l application/app/Services/DemoPublisherDownloadV1.php
          php -l application/app/Services/DemoPublisherApiV1.php
          php -l tests/demo_import_mysql_v100.php
          php -l tests/demo_import_native_install_v107.php
          php -l tests/demo_import_status_v108.php
          php -l tests/demo_import_native_limits_v109.php
          php -l tests/demo_import_shared_media_v110.php
          php -l tests/demo_import_media_unique_v111.php
          php -l application/app/Services/SystemToolService.php
          php -l tools/demo-export-source-v100.php
      - name: Manual Import premium UI contract
        run: |
          node --check assets/js/barama-demo-manual-v104.js
          node --check assets/js/barama-demo-premium-v103.js
          python3 - <<'PY'
          from pathlib import Path
          view=Path('application/resources/views/workspace/demo-importer.php').read_text()
          js=Path('assets/js/barama-demo-manual-v104.js').read_text()
          css=Path('assets/css/barama-demo-manual-v104.css').read_text()
          assert view.count("barama-demo-premium-v103.css")==1
          assert view.count("barama-demo-premium-v103.js")==1
          assert view.count("barama-demo-manual-v104.css")==1
          assert view.count("barama-demo-manual-v104.js")==1
          assert view.index("barama-demo-premium-v103.js") < view.index("barama-demo-manual-v104.js")
          assert 'Drag & Drop' in js and 'bdemo-manual-v104-drop' in css
          assert 'Review and import' in js and 'Download from publisher' in js
          assert 'bdemo-v103-preview' in js and 'bdemo-v103-ring' in js
          assert 'DemoImportPackageV1' not in js
          premium=Path('assets/js/barama-demo-premium-v103.js').read_text()
          premium_css=Path('assets/css/barama-demo-premium-v103.css').read_text()
          assert "https://baramarealestate.tonsamith.com/assets/images/barama-demo-preview-v103.webp" in premium
          assert "/assets/images/barama-homepage-hero-v1.webp" in premium
          assert "BARAMA_DEMO_LIGHT_CONTRAST_V105" in premium_css
          assert "barama-demo-premium-v103.css') . '?v=106" in view
          assert "barama-demo-premium-v103.js') . '?v=108" in view
          assert not Path('assets/images/barama-demo-preview-v103.webp').exists(), 'Out-of-band screenshot unexpectedly packaged'
          print('DEMO_PREVIEW_LIGHT_CONTRAST_V105_CONTRACT=PASS')
          print('MANUAL_UI_V104_CONTRACT=PASS')
          PY
      - name: Demo Importer feedback toast contract
        run: |
          php -l tests/demo_import_toast_v106.php
          php tests/demo_import_toast_v106.php
      - name: Signed public Policy Center snapshot contract
        run: |
          php -l application/app/Services/DemoPolicySnapshotV1.php
          php -l tests/demo_policy_snapshot_v114.php
          php tests/demo_policy_snapshot_v114.php

      - name: Signed demo package contract
        run: |
          php tests/demo_import_package_v100.php
          php tests/demo_publisher_api_v101.php
          php tests/demo_publisher_pin_v102.php
          php tests/demo_publisher_native_archive_v102.php
          php tests/demo_publisher_download_v101.php
          php tests/demo_publisher_integration_v101.php
      - name: Isolated MySQL signed-demo installation and safety backup
        env:
          BARAMA_DEMO_IT: isolated-ci
        run: php tests/demo_import_mysql_v100.php
      - name: Demo Importer real gate and review placement contract
        run: |
          node --check assets/js/barama-demo-premium-v103.js
          php tests/demo_import_status_v108.php
      - name: Verify DB path uniqueness reconciliation
        run: php tests/demo_import_media_unique_v111.php
      - name: Verify content-addressed media reuse and pre-existing file rejection
        run: php tests/demo_import_shared_media_v110.php
      - name: Publisher native and legacy import limits parity
        run: php tests/demo_import_native_limits_v109.php
      - name: Native publisher ZIP isolated install, rollback and empty-site guard
        env:
          BARAMA_DEMO_IT: isolated-ci
        run: php tests/demo_import_native_install_v107.php
      - name: Offline signer Python syntax
        run: python3 -m py_compile tools/demo-package-offline-sign-v100.py
