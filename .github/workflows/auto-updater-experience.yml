name: Auto Updater Experience V102
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/auto-updater-premium-experience-20261022]
permissions:
  contents: read
jobs:
  presentation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS syntax and no-authority-mutation behavior
        run: |
          set -Eeuo pipefail
          node --check assets/js/barama-auto-updater-unified-v100.js
          node tests/security/AutoUpdaterExperienceV102Test.cjs
      - name: Appendix-only regression and explicit theme contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          c=Path('assets/css/barama-auto-updater-theme-v101.css').read_text()
          j=Path('assets/js/barama-auto-updater-unified-v100.js').read_text()
          assert c.count('BARAMA_UNIFIED_AUTO_UPDATER_THEME_V101_END')==1
          assert c.count('BARAMA_AUTO_UPDATER_EXPERIENCE_V102_END')==1
          assert j.count('BARAMA_AUTO_UPDATER_EXPERIENCE_V102')==1
          assert "html[data-bs-theme=\"dark\"]" in c
          assert 'insertBefore(versions, overview)' in j
          assert 'insertBefore(readiness, overview)' in j
          assert 'bau-feedback-stack' in c and 'bau-feedback-stack' in j
          assert ".disabled = false" not in j
          print('AUTO_UPDATER_PREMIUM_PRESENTATION=PASS')
          print('LICENSE_AND_WORKER_AUTHORIZATION=UNCHANGED')
          PY
