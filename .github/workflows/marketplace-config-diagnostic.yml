name: Marketplace Config Diagnostic Lint

on:
  push:
    branches:
      - feat/marketplace-page-configuration-control

permissions:
  contents: read

jobs:
  repository:
    name: Lint SiteContentRepository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/app/Repositories/SiteContentRepository.php

  content-service:
    name: Lint SiteContentManagementService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/app/Services/SiteContentManagementService.php

  media-service:
    name: Lint SiteMediaStorageService
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/app/Services/SiteMediaStorageService.php

  admin-controller:
    name: Lint AdminManagementController
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/app/Http/Controllers/AdminManagementController.php

  dashboard-controller:
    name: Lint DashboardController
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/app/Http/Controllers/DashboardController.php

  marketplace-controller:
    name: Lint MarketplaceController
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/app/Http/Controllers/MarketplaceController.php

  company-controller:
    name: Lint CompanyController
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/app/Http/Controllers/CompanyController.php

  routes:
    name: Lint routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/routes/web.php

  workspace:
    name: Lint workspace view
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/resources/views/workspace/index.php

  hero-partial:
    name: Lint marketplace hero partial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/resources/views/components/marketplace-page-hero.php

  properties-view:
    name: Lint properties view
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/resources/views/marketplace/properties.php

  projects-view:
    name: Lint projects view
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/resources/views/marketplace/projects.php

  companies-view:
    name: Lint companies view
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l application/resources/views/company/index.php
