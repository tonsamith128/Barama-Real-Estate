name: System Tool
on:
  pull_request:
    paths:
      - 'application/app/Services/SystemToolService.php'
      - 'application/app/Http/Controllers/SystemToolController.php'
      - 'application/resources/views/workspace/system-tool.php'
      - 'assets/js/barama-system-tool-v100.js'
      - 'assets/css/barama-system-tool-v100.css'
      - 'application/routes/web.php'
      - 'application/resources/views/layouts/app.php'
      - 'tests/system_tool_contract_v100.php'
      - 'tests/system_tool_mysql_integration_v100.php'
      - '.github/workflows/system-tool.yml'
  push:
    branches:
      - main
      - 'feature/system-tool-*'
jobs:
  contracts:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: tool_test_password
          MYSQL_DATABASE: barama_tool_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, pdo_mysql, fileinfo
          coverage: none
      - name: PHP syntax
        run: |
          php -l application/app/Services/SystemToolService.php
          php -l application/app/Http/Controllers/SystemToolController.php
          php -l application/resources/views/workspace/system-tool.php
          php -l application/routes/web.php
          php -l application/resources/views/layouts/app.php
          php -l tests/system_tool_contract_v100.php
          php -l tests/system_tool_mysql_integration_v100.php
      - name: JavaScript syntax
        run: node --check assets/js/barama-system-tool-v100.js
      - name: Security and routing contracts
        run: php tests/system_tool_contract_v100.php
      - name: Isolated MySQL backup and restore integration
        env:
          SYSTEM_TOOL_INTEGRATION: isolated-ci
        run: php tests/system_tool_mysql_integration_v100.php
