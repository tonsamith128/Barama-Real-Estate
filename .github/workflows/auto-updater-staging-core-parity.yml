name: Auto Updater Staging Core Parity
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/auto-updater-core-staging-parity-20261022]
permissions:
  contents: read
jobs:
  staging-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, sodium, zip, pdo_mysql
          coverage: none
      - name: Syntax, integration and signed publisher trust contracts
        run: |
          set -Eeuo pipefail
          for p in \
            application/app/Services/Updates/PublisherTrustPaths.php \
            application/app/Services/Updates/OneClickUpdateQueueV1.php \
            application/app/Services/Updates/TrustedReleaseFeed.php \
            application/bin/oneclick-unprivileged-delivery.php \
            application/app/Http/Controllers/SystemCenterController.php \
            application/routes/web.php \
            application/resources/views/workspace/auto-updater-unified-v100.php \
            tests/security/AutoUpdaterUnifiedIntegrationContractTest.php
          do php -l "$p"; done
          php tests/security/AutoUpdaterUnifiedIntegrationContractTest.php
      - name: Read-only job progress and accepted UI
        run: |
          set -Eeuo pipefail
          node --check assets/js/barama-oneclick-status-v100.js
          node --test tests/security/OneClickDashboardStatusTest.cjs
          node tests/security/AutoUpdaterExperienceV102Test.cjs
      - name: Worker boundaries are fail-closed
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          q=Path('application/app/Services/Updates/OneClickUpdateQueueV1.php').read_text()
          c=Path('application/app/Http/Controllers/SystemCenterController.php').read_text()
          v=Path('application/resources/views/workspace/auto-updater-unified-v100.php').read_text()
          assert 'PRODUCTION_ONLY' not in q
          assert "if($site!==self::SITE||is_link($site)" in q
          assert "'authorized_to_install'=>false" in q
          assert 'systemOneClickWorkerReady' in v
          assert 'barama-auto-updater-experience-v103.css' in v
          assert 'PublisherTrustPaths::isProtectedStaging()' in c
          for text in (q,c,v):
              for forbidden in ('shell_exec(', 'passthru(', 'proc_open(', 'sudo ', 'systemctl '):
                  assert forbidden not in text, forbidden
          print('STAGING_QUEUES_INTENTS_ONLY=PASS')
          print('PRODUCTION_NO_ROOT_WORKER=PASS')
          print('NO_LIVE_INSTALLATION_EXECUTED=YES')
          PY
