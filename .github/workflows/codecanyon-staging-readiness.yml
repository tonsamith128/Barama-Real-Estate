name: CodeCanyon Staging Readiness

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/codecanyon-staging-readiness.yml'
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'tools/qa.php'
      - 'docs/CODECANYON_STAGING_ACCEPTANCE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/codecanyon-staging-readiness.yml'
      - 'VERSION'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/CODECANYON_STAGING_ACCEPTANCE.md'
      - 'tools/qa.php'

permissions:
  contents: read

jobs:
  exact-customer-package:
    name: Verified customer ZIP for cPanel and aaPanel staging
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: staging_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pstaging_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      PACKAGE_DB_HOST: 127.0.0.1
      PACKAGE_DB_PORT: '3306'
      PACKAGE_DB_DATABASE: barama_codecanyon_staging_ci
      PACKAGE_DB_USERNAME: root
      PACKAGE_DB_PASSWORD: staging_ci_only
      APP_ENV: testing
      APP_DEBUG: 'false'

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4

      - name: Setup customer minimum PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip, curl, mbstring, fileinfo, openssl
          coverage: none

      - name: Confirm CodeCanyon staging version and customer documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, os
          version=Path('VERSION').read_text().strip()
          assert re.fullmatch(r'(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)',version), 'VERSION_NOT_SEMVER'
          assert version=='1.0.0', 'UNREVIEWED_VERSION_CHANGE: CodeCanyon submission is scoped to v1.0.0'
          readme=Path('README.md').read_text()
          changelog=Path('CHANGELOG.md').read_text()
          assert '- Current development line: '+chr(96)+version+chr(96) in readme, 'README_VERSION_MISMATCH'
          assert '## '+version+' — ' in changelog, 'CHANGELOG_VERSION_MISMATCH'
          assert 'CodeCanyon target: '+chr(96)+'v1.0.0'+chr(96) in readme, 'VERSION_TARGET_CONFUSED'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PACKAGE_VERSION='+version+'\n')
          print('CUSTOMER_VERSION='+version)
          print('CODECANYON_1_0_0_SUBMISSION=NOT_YET_CERTIFIED')
          PY

      - name: Verify complete repository quality baseline
        run: php tools/qa.php

      - name: Verify canonical production asset references
        run: |
          php tools/canonical-assets-smoke.php
          node --check assets/js/admin-email-template-builder.js
          node --check assets/js/public-location-picker.js
          node --check assets/js/page-builder.js

      - name: Verify Invoices/Turnstile v1.0.0 regression guard
        run: |
          php -l application/database/migrations/0032_create_invoice_templates.php
          php -l application/app/Repositories/InvoiceTemplateRepository.php
          php -l application/resources/views/workspace/partials/invoice-template.php
          php tools/invoices-turnstile-release-smoke.php

      - name: Verify Media Library upload entrypoint, storage, and preview
        run: |
          php -l application/app/Services/MediaLibraryUploadService.php
          php -l application/app/Services/MediaLibraryPreviewService.php
          php -l application/resources/views/workspace/media-upload.php
          node --check assets/js/media-library-upload-v134.js
          php tools/media-library-upload-route-smoke.php

      - name: Verify hosting installer and customer source syntax
        run: |
          set -Eeuo pipefail
          php tools/installer-clean-routing-smoke.php
          php tools/route-contract-smoke.php
          node --check assets/js/barama-demo-manual-v104.js
          php -l application/resources/views/workspace/demo-importer.php
          php -l application/app/Services/InstallerService.php

      - name: Build canonical complete customer ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          php tools/build-package.php
          cd build
          sha256sum -c "Barama-Real-Estate-$PACKAGE_VERSION.zip.sha256"
          unzip -tq "Barama-Real-Estate-$PACKAGE_VERSION.zip"

      - name: Verify exact ZIP privacy, version and archive structure
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import pathlib,zipfile,re,os,hashlib
          version=os.environ['PACKAGE_VERSION']
          p=pathlib.Path('build')/('Barama-Real-Estate-'+version+'.zip')
          assert p.is_file() and p.stat().st_size>100000, 'INCOMPLETE_CUSTOMER_ARCHIVE'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'CORRUPT_ZIP'
              info=z.infolist()
              names=[i.filename for i in info if not i.is_dir()]
              assert len(names)==len(set(names)), 'DUPLICATE_ZIP_ENTRIES'
              assert len(names)==len({n.casefold() for n in names}), 'CASE_COLLIDING_ENTRIES'
              assert z.read('VERSION').decode().strip()==version, 'PACKAGE_VERSION_MISMATCH'
              assert z.comment.decode()==f'Barama Real Estate {version} customer package.', 'ZIP_COMMENT_VERSION_DRIFT'
              assert {'index.php','.htaccess','installer/index.php','updater/index.php',
                      'documentation/index.html','documentation/NGINX_CLEAN_URLS.md',
                      'application/resources/views/workspace/demo-importer.php',
                      'assets/css/barama-demo-manual-v104.css',
                      'assets/js/barama-demo-manual-v104.js'} <= set(names), 'CUSTOMER_FUNCTION_MISSING'
              for item in info:
                  n=item.filename
                  assert not n.startswith('/') and not re.match(r'^[A-Za-z]:',n), 'ABSOLUTE_PATH'
                  assert '..' not in pathlib.PurePosixPath(n).parts, 'PATH_TRAVERSAL'
                  assert not n.startswith(('.git/','.github/','docs/','build/','vendor/','node_modules/')), 'DEVELOPMENT_FILES'
                  assert (item.external_attr >> 16 & 0o170000)!=0o120000, 'SYMLINK_IN_ARCHIVE'
                  if n.startswith('application/storage/') and not item.is_dir():
                      assert n in {
                          'application/storage/cache/.gitignore',
                          'application/storage/logs/.gitignore',
                          'application/storage/uploads/.gitignore',
                          'application/storage/uploads/.htaccess'
                      }, 'CUSTOMER_RUNTIME_STATE'
                  assert n not in {'.env','.env.example'}, 'ENV_FILE_LEAK'
          print('INNER_CUSTOMER_ZIP=COMPLETE')
          print('SOURCE_VERSION='+version)
          print('ZIP_SHA256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: CodeCanyon code/security and customer ZIP compliance
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP="build/Barama-Real-Estate-$PACKAGE_VERSION.zip"
          php tools/package-compliance-smoke.php "$ZIP"
          php tools/codecanyon-smoke.php "$ZIP"
          php tools/canonical-assets-smoke.php "$ZIP"

      - name: Install exact customer ZIP on disposable MySQL
        shell: bash
        run: |
          set -Eeuo pipefail
          php tools/package-smoke.php "build/Barama-Real-Estate-$PACKAGE_VERSION.zip"

      - name: Verify exact customer ZIP upgrade path
        shell: bash
        run: |
          set -Eeuo pipefail
          php tools/package-upgrade-smoke.php "build/Barama-Real-Estate-$PACKAGE_VERSION.zip"

      - name: Run exact-ZIP Apache and Nginx container acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n tools/webserver-package-smoke.sh
          bash tools/webserver-package-smoke.sh "build/Barama-Real-Estate-$PACKAGE_VERSION.zip"

      - name: Generate and verify immutable source-commit artifact binding
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP="build/Barama-Real-Estate-$PACKAGE_VERSION.zip"
          MANIFEST="build/Barama-Real-Estate-$PACKAGE_VERSION.artifact.json"
          php tools/rc1-artifact.php generate "$ZIP" --source-commit="$GITHUB_SHA" --manifest="$MANIFEST"
          php tools/rc1-artifact.php verify "$MANIFEST" "$ZIP" --expect-version="$PACKAGE_VERSION" --expect-commit="$GITHUB_SHA"
          (cd build && sha256sum -c "Barama-Real-Estate-$PACKAGE_VERSION.zip.sha256")

      - name: Create staging instructions and truthful gate report
        shell: bash
        run: |
          set -Eeuo pipefail
          cp docs/CODECANYON_STAGING_ACCEPTANCE.md build/STAGING_HOSTING_CHECKLIST.md
          {
            printf 'Product: Barama Real Estate\n'
            printf 'Staging candidate version: %s\n' "$PACKAGE_VERSION"
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'GitHub Actions run ID: %s\n' "$GITHUB_RUN_ID"
            printf 'File: Barama-Real-Estate-%s.zip\n' "$PACKAGE_VERSION"
            printf 'SHA-256: %s\n' "$(sha256sum "build/Barama-Real-Estate-$PACKAGE_VERSION.zip" | cut -d' ' -f1)"
            printf 'Automated tests: repository QA, installer routing, ZIP structure/private-state check, CodeCanyon compliance, MySQL fresh install, MySQL upgrade, Apache + Nginx exact ZIP: PASSED\n'
            printf 'cPanel live domain installation: PENDING USER STAGING ACCEPTANCE\n'
            printf 'aaPanel live domain installation: PENDING USER STAGING ACCEPTANCE\n'
            printf 'Live license/Envato and full demo-content installation: PENDING LIVE ACCEPTANCE\n'
            printf 'Browser/device, emails, human design/content and CodeCanyon final review: PENDING\n'
            printf 'CodeCanyon version 1.0.0 public submission: NOT CERTIFIED\n'
          } > build/STAGING_READINESS_REPORT.txt
          test -s build/STAGING_READINESS_REPORT.txt

      - name: Publish CodeCanyon staging package to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Barama-Real-Estate-v${{ env.PACKAGE_VERSION }}-CodeCanyon-Staging-${{ github.sha }}
          path: |
            build/Barama-Real-Estate-*.zip
            build/Barama-Real-Estate-*.zip.sha256
            build/Barama-Real-Estate-*.artifact.json
            build/STAGING_HOSTING_CHECKLIST.md
            build/STAGING_READINESS_REPORT.txt
          retention-days: 30
          if-no-files-found: error
