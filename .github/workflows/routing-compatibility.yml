name: Barama Routing Compatibility

on:
  push:
    branches:
      - fix/installer-application-routing-compat-20261014
  pull_request:
    paths:
      - 'application/app/Services/InstallerService.php'
      - 'application/app/Support/helpers.php'
      - 'tools/http-routing-smoke.php'
      - '.github/workflows/routing-compatibility.yml'

permissions:
  contents: read

jobs:
  query-routing:
    name: PHP Routing & Installer Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring, fileinfo, openssl
          coverage: none
      - name: Validate PHP syntax
        run: |
          php -l application/app/Services/InstallerService.php
          php -l application/app/Support/helpers.php
          php -l tools/http-routing-smoke.php
      - name: Verify clean and rewrite-free PHP routing
        run: php tools/http-routing-smoke.php
      - name: Verify installer accepts both routing modes without bypassing entrypoint check
        run: |
          php -r '
          $source = file_get_contents("application/app/Services/InstallerService.php");
          if (!str_contains($source, "Barama application entrypoint")
              || !str_contains($source, "'\''status'\'' => '\''pass'\''")
              || !str_contains($source, "built-in PHP routing works without URL rewrites")) {
              exit(1);
          }
          echo "[PASS] Compatible built-in routing and packaged entrypoint guard present.\n";
          '
