name: Barama Routing Compatibility

on:
  push:
    branches:
      - fix/installer-application-routing-compat-20261014
  pull_request:
    paths:
      - 'application/app/Services/InstallerService.php'
      - 'docs/INSTALLER.md'
      - 'docs/HOSTING_COMPATIBILITY.md'
      - 'documentation/NGINX_CLEAN_URLS.md'
      - 'tools/installer-clean-routing-smoke.php'
      - 'tools/auth-premium-routing-smoke.cjs'
      - 'assets/js/auth-*.js'
      - 'assets/css/auth-premium-v117a33.css'
      - 'application/resources/views/layouts/app.php'
      - 'application/app/Support/helpers.php'
      - 'tools/http-routing-smoke.php'
      - '.github/workflows/routing-compatibility.yml'

permissions:
  contents: read

jobs:
  clean-routing:
    name: Clean URL Installer Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring, fileinfo, openssl
          coverage: none
      - name: Validate PHP syntax
        run: |
          php -l application/app/Services/InstallerService.php
          php -l application/app/Support/helpers.php
          php -l tools/http-routing-smoke.php
          php -l tools/installer-clean-routing-smoke.php
      - name: Verify clean and legacy URL parsing
        run: php tools/http-routing-smoke.php
      - name: Verify mandatory clean routing for new installations
        run: php tools/installer-clean-routing-smoke.php
      - name: Verify premium authentication UI on clean and PHP routes
        run: node tools/auth-premium-routing-smoke.cjs
      - name: Verify Barama entrypoint is required
        run: grep -Fq 'Barama application entrypoint' application/app/Services/InstallerService.php
