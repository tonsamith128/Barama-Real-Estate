name: Sync Admin Listings v1.1.28

on:
  push:
    branches:
      - sync/admin-listings-v1.1.28
    paths:
      - '.github/workflows/sync-admin-listings-v1128.yml'
      - 'tools/sync_admin_listings_v1128.py'

permissions:
  contents: write

jobs:
  apply-production-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: sync/admin-listings-v1.1.28
          fetch-depth: 0

      - name: Apply exact accepted v1.1.28 semantic patch
        run: |
          set -Eeuo pipefail
          python3 tools/sync_admin_listings_v1128.py .
          php -l application/resources/views/workspace/index.php
          php -l application/app/Repositories/WorkspaceReadRepository.php

      - name: Verify idempotence and scoped diff
        run: |
          set -Eeuo pipefail
          VIEW='application/resources/views/workspace/index.php'
          REPO='application/app/Repositories/WorkspaceReadRepository.php'
          CSS='assets/css/app.css'

          V1="$(sha256sum "$VIEW" | awk '{print $1}')"
          R1="$(sha256sum "$REPO" | awk '{print $1}')"
          C1="$(sha256sum "$CSS" | awk '{print $1}')"

          python3 tools/sync_admin_listings_v1128.py .
          php -l "$VIEW"
          php -l "$REPO"

          V2="$(sha256sum "$VIEW" | awk '{print $1}')"
          R2="$(sha256sum "$REPO" | awk '{print $1}')"
          C2="$(sha256sum "$CSS" | awk '{print $1}')"

          test "$V1" = "$V2"
          test "$R1" = "$R2"
          test "$C1" = "$C2"

          git diff --check

          ACTUAL="$(git diff --name-only | LC_ALL=C sort)"
          EXPECTED="$(printf '%s\n' \
            application/app/Repositories/WorkspaceReadRepository.php \
            application/resources/views/workspace/index.php \
            assets/css/app.css | LC_ALL=C sort)"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo 'Unexpected source diff:'
            printf '%s\n' "$ACTUAL"
            exit 1
          fi

      - name: Remove temporary sync helpers and commit exact source parity
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            application/app/Repositories/WorkspaceReadRepository.php \
            application/resources/views/workspace/index.php \
            assets/css/app.css

          git rm tools/sync_admin_listings_v1128.py
          git rm .github/workflows/sync-admin-listings-v1128.yml

          git diff --cached --check
          git commit -m 'Sync accepted Admin Listings v1.1.28 production source'
          git push origin HEAD:sync/admin-listings-v1.1.28
