name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  foundation-qa:
    name: Foundation QA
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: barama_test
          MYSQL_USER: barama
          MYSQL_PASSWORD: barama_test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: false
      APP_URL: http://localhost
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: barama_test
      DB_USERNAME: barama
      DB_PASSWORD: barama_test_password
      MAIL_DRIVER: log
      MAIL_FROM_ADDRESS: no-reply@example.test
      MAIL_FROM_NAME: Barama Real Estate QA
      PACKAGE_DB_HOST: 127.0.0.1
      PACKAGE_DB_PORT: 3306
      PACKAGE_DB_DATABASE: barama_package_test
      PACKAGE_DB_USERNAME: root
      PACKAGE_DB_PASSWORD: root_test_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip, curl, mbstring, fileinfo
          coverage: none

      - name: Run repository QA
        run: php tools/qa.php

      - name: Verify Plans page actions, theme and accessibility controls
        run: |
          php -l application/resources/views/workspace/finance-plans.php
          php tools/finance-plans-premium-smoke.php
          node --check assets/js/finance-plans-actions-v181.js

      - name: Verify Plans Create/Edit modal theme
        run: |
          php -l application/resources/views/workspace/finance-plans.php
          php tools/finance-plans-modal-theme-smoke.php

      - name: Verify persistent Auto Updater license status
        run: |
          php -l application/app/Services/PublisherVerificationRecord.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l application/resources/views/workspace/system-center.php
          php tools/publisher-verification-record-smoke.php
          node --check assets/js/barama-auto-updater-premium-v120.js
          node --check assets/js/barama-publisher-license-ux-v112.js

      - name: Verify Auto Updater actions and publisher entitlement outcomes
        run: |
          php -l application/resources/views/workspace/system-center.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l application/app/Services/Updates/TrustedReleaseFeed.php
          php tools/auto-updater-header-actions-smoke.php
          php tools/auto-updater-entitlement-results-smoke.php
          
      - name: Reject premature One-click installation from dashboard
        run: |
          php -l application/app/Services/Updates/OneClickDashboardGateV1.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l application/resources/views/workspace/system-center.php
          php -l tools/oneclick-dashboard-gate-smoke.php
          php tools/oneclick-dashboard-gate-smoke.php

      - name: Prove signed-plan backup evidence cannot authorize one-click installation
        run: |
          php -l application/app/Services/Updates/OneClickOfflinePreparationV1.php
          php -l tools/oneclick-offline-preparation-smoke.php
          php tools/oneclick-offline-preparation-smoke.php

      - name: Classify updater crash states without privileged recovery
        run: |
          php -l application/app/Services/Updates/OneClickRecoveryJournalV1.php
          php -l tools/oneclick-recovery-journal-smoke.php
          php tools/oneclick-recovery-journal-smoke.php

      - name: Reject stale signed-inspection snapshots before displaying verified release
        run: |
          php -l application/app/Services/Updates/OneClickInspectionFreshnessV1.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l application/resources/views/workspace/system-center.php
          php -l tools/oneclick-signed-inspection-freshness-smoke.php
          php tools/oneclick-signed-inspection-freshness-smoke.php

      - name: Verify customer domain binding uses trusted installed APP_URL
        run: |
          php -l application/app/Services/Updates/OneClickInstalledDomainV1.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l tools/oneclick-configured-domain-smoke.php
          php tools/oneclick-configured-domain-smoke.php

      - name: Verify signed file changes preview cannot authorize installation
        run: |
          php -l application/app/Services/Updates/OneClickSignedPlanPreviewV1.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l application/resources/views/workspace/system-center.php
          php -l application/routes/web.php
          php -l tools/oneclick-signed-change-preview-smoke.php
          php tools/oneclick-signed-change-preview-smoke.php

      - name: Verify mandatory recovery snapshot preparation is root-only and not install authorization
        run: |
          php -l application/app/Services/Updates/OneClickRecoverySnapshotPairV1.php
          php -l tools/oneclick-mandatory-recovery-pair-smoke.php
          php tools/oneclick-mandatory-recovery-pair-smoke.php

      - name: Execute isolated real file updates and crash recovery
        run: |
          php -l application/app/Services/Updates/OneClickAtomicTransactionV1.php
          php -l tools/oneclick-atomic-transaction-smoke.php
          php tools/oneclick-atomic-transaction-smoke.php

      - name: Verify staging-only private database backup fixture
        run: |
          php -l application/app/Services/Updates/PrivateDatabaseBackupV2.php
          php -l tools/private-database-backup-safety-smoke.php
          php tools/private-database-backup-safety-smoke.php

      - name: Verify private updater file snapshots and fixture-only rollback
        run: |
          php -l application/app/Services/Updates/PrivateUpdateFileSnapshotV1.php
          php -l tools/private-update-file-snapshot-smoke.php
          php tools/private-update-file-snapshot-smoke.php

      - name: Verify signed read-only update plan
        run: |
          php -l application/app/Services/Updates/VerifiedReleaseFilePlanV2.php
          php -l tools/verified-release-file-plan-smoke.php
          php tools/verified-release-file-plan-smoke.php

      - name: Verify private signed-plan file backup and isolated recovery rehearsal
        run: |
          php -l application/app/Services/Updates/VerifiedUpdateBackupV2.php
          php -l tools/verified-update-snapshot-v2-smoke.php
          php tools/verified-update-snapshot-v2-smoke.php

      - name: Rehearse isolated locked updater transaction and rollback
        run: |
          php -l application/app/Services/Updates/IsolatedUpdateTransactionV1.php
          php -l tools/isolated-update-transaction-smoke.php
          php tools/isolated-update-transaction-smoke.php

      - name: Verify MySQL recovery guard without DB access
        run: |
          php -l application/app/Services/Updates/IsolatedMysqlRecoveryV1.php
          php -l tools/isolated-mysql-recovery-smoke.php
          php tools/isolated-mysql-recovery-smoke.php --guard

      - name: Export and restore disposable SQL into isolated CI MySQL schemas
        env:
          BARAMA_CI_ISOLATED_MYSQL_RECOVERY: ALLOW_DISPOSABLE_TEST_SCHEMAS_ONLY
        run: php tools/isolated-mysql-recovery-smoke.php --ci

      - name: Verify full-object SQL recovery script refuses non-CI execution
        run: |
          bash -n tools/ci-full-object-mysql-recovery.sh
          bash tools/ci-full-object-mysql-recovery.sh --guard

      - name: Rehearse genuine MySQL full-object backup and restore in disposable CI service
        env:
          BARAMA_CI_FULL_OBJECT_MYSQL: ALLOW_DISPOSABLE_MYSQL8_SERVICE_ONLY
          MYSQL_SERVICE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: bash tools/ci-full-object-mysql-recovery.sh --ci

      - name: Verify fail-closed staging update readiness gate
        run: |
          php -l application/app/Services/Updates/StagingUpdateReadinessV1.php
          php -l tools/staging-update-readiness-smoke.php
          php tools/staging-update-readiness-smoke.php

      - name: Verify genuinely signed staged ZIP and fail-closed update blockers
        run: |
          php -l application/app/Services/Updates/StagingSignedReleasePreflightV1.php
          php -l tools/staging-signed-release-preflight-smoke.php
          php tools/staging-signed-release-preflight-smoke.php

      - name: Verify reproducible reviewed code-only V2 update ZIP
        run: |
          php -l tools/build-v2-update-candidate.php
          php -l tools/v2-update-candidate-smoke.php
          php tools/v2-update-candidate-smoke.php

      - name: Verify offline Publisher V2 signing against real Barama PHP inspector
        run: |
          python3 -m py_compile tools/offline-release-envelope.py tools/offline-release-envelope-self-test.py
          python3 tools/offline-release-envelope-self-test.py

      - name: Verify owner-evidence-gated read-only staging release acceptance
        run: |
          php -l application/app/Services/Updates/StagingReleaseAcceptanceV1.php
          php -l tools/staging-release-acceptance-smoke.php
          php tools/staging-release-acceptance-smoke.php

      - name: Bind publisher entitlement to exact staging ZIP without installing
        run: |
          php -l application/app/Services/Updates/StagingPublisherCandidateV1.php
          php -l application/app/Services/Updates/TrustedReleaseFeed.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l tools/staging-publisher-candidate-smoke.php
          php tools/staging-publisher-candidate-smoke.php

      - name: Refuse deleting racing root-private updater artifacts on transfer failure
        run: |
          php -l application/app/Services/Updates/PrivateArtifactReceiverV2.php
          php -l tools/private-artifact-receiver-race-smoke.php
          sudo -E php tools/private-artifact-receiver-race-smoke.php

      - name: Verify root-only authenticated private publisher delivery contract
        run: |
          php -l application/app/Services/Updates/PublisherPrivateDeliveryV1.php
          php -l application/bin/publisher-private-delivery.php
          php -l tools/publisher-private-delivery-smoke.php
          sudo -E php tools/publisher-private-delivery-smoke.php

      - name: Test standalone publisher delivery configuration bootstrap
        run: |
          php -l application/bin/publisher-private-delivery.php
          php -l tools/publisher-delivery-cli-bootstrap-smoke.php
          php tools/publisher-delivery-cli-bootstrap-smoke.php

      - name: Verify publisher public key trust bootstrap against pinned fingerprint
        run: |
          php -l application/app/Services/Updates/PublisherTrustBootstrapV1.php
          php -l application/bin/publisher-trust-bootstrap.php
          php -l tools/publisher-trust-bootstrap-smoke.php
          sudo -E php tools/publisher-trust-bootstrap-smoke.php

      - name: Verify publisher public-key origin handoff is fail-closed
        run: |
          python3 -B tools/publisher-trust-handoff-smoke.py
          python3 -m py_compile tools/publisher-trust-handoff.py

      - name: Run localization contract smoke test
        run: php tools/localization-smoke.php

      - name: Enable audit trigger capability on isolated CI MySQL
        run: |
          docker exec "${{ job.services.mysql.id }}" \
            mysql -uroot -proot_test_password \
            -e "SET GLOBAL log_bin_trust_function_creators = 1;"

      - name: Run database migrations
        run: php tools/migrate.php

      - name: Verify migrated schema
        run: php tools/schema-smoke.php

      - name: Verify migration replay is clean
        run: php tools/migrate.php

      - name: Reject real Barama schema recovery outside disposable GitHub CI
        run: |
          bash -n tools/ci-barama-schema-restore.sh
          php -l tools/ci-barama-schema-restore-compare.php
          bash tools/ci-barama-schema-restore.sh --guard
          php tools/ci-barama-schema-restore-compare.php --guard

      - name: Restore and verify real Barama migration schema in disposable CI MySQL
        env:
          BARAMA_CI_REAL_SCHEMA_RECOVERY: ALLOW_MIGRATED_CI_DATABASE_COPY_ONLY
          MYSQL_SERVICE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: bash tools/ci-barama-schema-restore.sh --ci

      - name: Reject coordinated recovery outside disposable GitHub CI
        run: |
          bash -n tools/ci-coordinated-code-db-rollback.sh
          bash tools/ci-coordinated-code-db-rollback.sh --guard

      - name: Rehearse coordinated code and database rollback after injected failure
        env:
          BARAMA_CI_COORDINATED_ROLLBACK: ALLOW_DISPOSABLE_COORDINATED_CI_ONLY
          BARAMA_CI_REAL_SCHEMA_RECOVERY: ALLOW_MIGRATED_CI_DATABASE_COPY_ONLY
          MYSQL_SERVICE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: bash tools/ci-coordinated-code-db-rollback.sh --ci

      - name: Reject process-crash recovery outside disposable GitHub CI
        run: |
          bash -n tools/ci-process-crash-recovery.sh
          bash tools/ci-process-crash-recovery.sh --guard

      - name: Rehearse updater SIGKILL and independent recovery process
        env:
          BARAMA_CI_PROCESS_CRASH: ALLOW_DISPOSABLE_SIGKILL_CI_ONLY
          BARAMA_CI_REAL_SCHEMA_RECOVERY: ALLOW_MIGRATED_CI_DATABASE_COPY_ONLY
          MYSQL_SERVICE_CONTAINER_ID: ${{ job.services.mysql.id }}
        run: bash tools/ci-process-crash-recovery.sh --ci

      - name: Run newsletter subscription smoke test
        run: php tools/newsletter-smoke.php

      - name: Run domain write smoke test
        run: php tools/domain-write-smoke.php

      - name: Run account and onboarding smoke test
        run: php tools/account-onboarding-smoke.php

      - name: Run release security hardening smoke test
        run: php tools/security-hardening-smoke.php

      - name: Run notification delivery smoke test
        run: php tools/notification-smoke.php

      - name: Run SMTP transport smoke test
        run: php tools/smtp-smoke.php

      - name: Run License Manager contract smoke test
        run: php tools/license-contract-smoke.php

      - name: Run HTTP routing normalization smoke test
        run: php tools/http-routing-smoke.php
      - name: Enforce clean routing for new customer installations
        run: php tools/installer-clean-routing-smoke.php
      - name: Verify premium auth JavaScript without inline CSS
        run: node tools/auth-premium-routing-smoke.cjs

      - name: Run route/controller contract smoke test
        run: php tools/route-contract-smoke.php

      - name: Validate RC1 acceptance record and promotion guard
        run: php tools/rc1-readiness.php

      - name: Run controlled RC1 evidence workflow smoke test
        run: php tools/rc1-evidence-smoke.php

      - name: Run RC candidate artifact binding smoke test
        run: php tools/rc1-artifact-smoke.php

      - name: Run live acceptance session guard smoke test
        run: php tools/rc1-live-session-smoke.php

      - name: Run aaPanel acceptance bundle smoke test
        run: php tools/acceptance-bundle-smoke.php

      - name: Run source upgrade compatibility smoke test
        run: php tools/upgrade-smoke.php

      - name: Build exact customer package
        run: php tools/build-package.php

      - name: Generate and verify RC candidate artifact manifest
        run: |
          ZIP="build/Barama-Real-Estate-$(cat VERSION).zip"
          MANIFEST="build/Barama-Real-Estate-$(cat VERSION).artifact.json"
          php tools/rc1-artifact.php generate "$ZIP" --source-commit="${GITHUB_SHA}" --manifest="$MANIFEST"
          php tools/rc1-artifact.php verify "$MANIFEST" "$ZIP" --expect-version="$(cat VERSION)" --expect-commit="${GITHUB_SHA}"

      - name: Build internal aaPanel acceptance bundle
        run: |
          ZIP="build/Barama-Real-Estate-$(cat VERSION).zip"
          MANIFEST="build/Barama-Real-Estate-$(cat VERSION).artifact.json"
          php tools/build-acceptance-bundle.php "$ZIP" "$MANIFEST" --source-commit="${GITHUB_SHA}"

      - name: Validate exact customer package compliance
        run: php tools/package-compliance-smoke.php build/Barama-Real-Estate-$(cat VERSION).zip

      - name: Validate CodeCanyon package preparation
        run: php tools/codecanyon-smoke.php build/Barama-Real-Estate-$(cat VERSION).zip

      - name: Validate exact customer package installer
        run: php tools/package-smoke.php build/Barama-Real-Estate-$(cat VERSION).zip

      - name: Validate exact customer package upgrade
        run: php tools/package-upgrade-smoke.php build/Barama-Real-Estate-$(cat VERSION).zip

      - name: Upload validated customer package
        uses: actions/upload-artifact@v4
        with:
          name: Barama-Real-Estate-${{ github.sha }}
          path: |
            build/*.zip
            build/*.sha256
            build/*.artifact.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload internal aaPanel acceptance bundle
        uses: actions/upload-artifact@v4
        with:
          name: Barama-aaPanel-Acceptance-${{ github.sha }}
          path: |
            build/acceptance/*.zip
            build/acceptance/*.sha256
          if-no-files-found: error
          retention-days: 7


  webserver-compat:
    name: Exact Package Web Server QA
    needs: foundation-qa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated customer package
        uses: actions/download-artifact@v4
        with:
          name: Barama-Real-Estate-${{ github.sha }}
          path: validated-package

      - name: Verify package checksum
        run: |
          cd validated-package
          sha256sum -c Barama-Real-Estate-$(cat ../VERSION).zip.sha256

      - name: Verify RC candidate artifact binding
        run: |
          ZIP="validated-package/Barama-Real-Estate-$(cat VERSION).zip"
          MANIFEST="validated-package/Barama-Real-Estate-$(cat VERSION).artifact.json"
          php tools/rc1-artifact.php verify "$MANIFEST" "$ZIP" --expect-version="$(cat VERSION)" --expect-commit="${GITHUB_SHA}"

      - name: Validate web-server QA script syntax
        run: bash -n tools/webserver-package-smoke.sh

      - name: Run Apache and Nginx exact-package routing QA
        run: |
          ZIP="validated-package/Barama-Real-Estate-$(cat VERSION).zip"
          bash tools/webserver-package-smoke.sh "$ZIP"


  browser-compat:
    name: Exact Package Browser & Accessibility QA
    needs: foundation-qa
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      PACKAGE_DB_HOST: 127.0.0.1
      PACKAGE_DB_PORT: 3306
      PACKAGE_DB_USERNAME: root
      PACKAGE_DB_PASSWORD: root_test_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip, curl, mbstring, fileinfo
          coverage: none

      - name: Download validated customer package
        uses: actions/download-artifact@v4
        with:
          name: Barama-Real-Estate-${{ github.sha }}
          path: validated-package

      - name: Verify package checksum
        run: |
          cd validated-package
          sha256sum -c Barama-Real-Estate-$(cat ../VERSION).zip.sha256

      - name: Verify RC candidate artifact binding
        run: |
          ZIP="validated-package/Barama-Real-Estate-$(cat VERSION).zip"
          MANIFEST="validated-package/Barama-Real-Estate-$(cat VERSION).artifact.json"
          php tools/rc1-artifact.php verify "$MANIFEST" "$ZIP" --expect-version="$(cat VERSION)" --expect-commit="${GITHUB_SHA}"

      - name: Validate browser QA script syntax
        run: bash -n tools/browser-package-smoke.sh

      - name: Run exact-package browser and accessibility QA
        run: |
          ZIP="validated-package/Barama-Real-Estate-$(cat VERSION).zip"
          bash tools/browser-package-smoke.sh "$ZIP"

      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Barama-Browser-QA-${{ github.sha }}
          path: browser-qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
