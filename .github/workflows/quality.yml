name: Laravel v2 Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, curl, openssl
          coverage: none
      - name: PHP syntax
        run: find app bootstrap config database routes scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Native Laravel structure and exactly two CSS sources
        run: php scripts/verify-structure.php
      - name: Reject old Pure PHP code
        run: php scripts/verify-no-legacy.php
      - name: Composer manifest validation
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Routes and feature tests
        run: |
          php artisan route:list
          php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build area bundles
        run: |
          npm install --no-audit --no-fund
          npm run build
