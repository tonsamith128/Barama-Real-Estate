name: Barama Laravel 13 Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, pdo_sqlite, pdo_mysql, curl, openssl, zip, sodium
          coverage: none
      - name: PHP syntax
        run: find app bootstrap config database routes scripts tests Installer public/installer support -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Offline rehearsal and hosting checker syntax
        run: |
          bash -n scripts/acceptance/legacy-clone-stage-synthetic.sh
          bash -n support/barama_clone_host_acceptance.sh
          php -l support/BaramaLegacyCloneStager.php
          php -l support/barama_isolated_clone_inventory.php
          php -l support/barama_isolated_media_inventory.php
          php -l support/barama_isolated_clone_stage.php
      - name: Refuse unsafe sensitive legacy backup comparison
        run: |
          set -Eeuo pipefail
          if APP_ENV=production php support/barama_sensitive_restore_compare.php --compare-restores > /tmp/barama-restore-negative.log 2>&1; then
            echo "FAILED=PRODUCTION_RESTORE_COMPARISON_ACCEPTED"; exit 1
          fi
          if ! grep -q 'RESTORE_DENIED=PRIVATE_TESTING_ONLY' /tmp/barama-restore-negative.log; then
            echo "FAILED=RESTORE_GUARD_MESSAGE"; exit 1
          fi
          rm -f /tmp/barama-restore-negative.log
          echo "SENSITIVE_RESTORE_PRODUCTION_GUARD=PASS"
      - name: Native Laravel structure and exactly two CSS sources
        run: php scripts/verify-structure.php
      - name: Reject retired application runtimes
        run: php scripts/verify-laravel-only.php
      - name: Reject stale partial overlays and misleading production UI
        run: php scripts/verify-ui-hygiene.php
      - name: Composer manifest validation
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Routes and feature tests
        run: |
          php artisan route:list
          composer test
      - name: Standalone installer and root-domain routing validation
        run: |
          php tests/Installer/InstallerUnitTest.php
          php tests/Installer/RootRoutingTest.php
          php tests/Installer/PurchaseCodeUrlTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build area bundles
        run: |
          npm install --no-audit --no-fund
          npm run build

