name: Laravel v2 Foundation Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, curl
          coverage: none
      - name: Validate structure
        run: php scripts/verify-structure.php
      - name: Reject legacy Pure PHP application
        run: |
          php -l scripts/verify-no-legacy.php
          php scripts/verify-no-legacy.php
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npm run build
