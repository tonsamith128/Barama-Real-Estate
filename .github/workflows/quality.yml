name: Laravel v2 Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, pdo_sqlite, pdo_mysql, curl, openssl, zip, sodium
          coverage: none
      - name: PHP syntax
        run: find app bootstrap config database routes scripts tests Installer public/installer -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Native Laravel structure and exactly two CSS sources
        run: php scripts/verify-structure.php
      - name: Reject old Pure PHP code
        run: php scripts/verify-no-legacy.php
      - name: Composer manifest validation
        run: composer validate --no-check-publish
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Routes and feature tests
        run: |
          php artisan route:list
          composer test
      - name: Standalone installer and root-domain routing validation
        run: |
          php tests/Installer/InstallerUnitTest.php
          php tests/Installer/RootRoutingTest.php
          php tests/Installer/PurchaseCodeUrlTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build area bundles
        run: |
          npm install --no-audit --no-fund
          npm run build

  installer-mysql:
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: barama_installer_qa
          MYSQL_USER: barama
          MYSQL_PASSWORD: ci_installer_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, fileinfo, pdo_mysql, pdo_sqlite, curl, openssl, zip, sodium
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile production assets
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Build integrated QA and installer hotfix packages
        run: |
          bash scripts/build-qa-package.sh
          bash scripts/build-installer-routing-hotfix.sh
          bash scripts/build-cpanel-postinstall-upgrade.sh
          python3 scripts/verify-cpanel-upgrade-assets.py
          bash scripts/build-media-library-upgrade.sh
          bash scripts/build-policy-center-upgrade.sh
          bash scripts/build-customer-dashboard-upgrade.sh
          bash scripts/build-dashboard-viewing-upgrade.sh
          bash scripts/build-catalog-moderation-upgrade.sh
          bash scripts/build-appearance-upgrade.sh
      - name: Apache root-domain installer and private-source security smoke
        run: bash tests/Installer/RootApacheSmoke.sh
      - name: HTTP five-step MySQL fresh-install acceptance FROM PACKAGE
        env:
          INSTALLER_TEST_DB: barama_installer_qa
          INSTALLER_TEST_USER: barama
          INSTALLER_TEST_PASSWORD: ci_installer_password
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/barama-qa-extracted
          unzip -q "$GITHUB_WORKSPACE/dist/Barama-Laravel-Integrated-QA.zip" -d /tmp/barama-qa-extracted
          cd /tmp/barama-qa-extracted/Barama-Laravel-Integrated-QA
          test "$(stat -c '%a' .)" = 755
          test "$(stat -c '%a' public)" = 755
          test "$(stat -c '%a' public/installer)" = 755
          test "$(stat -c '%a' public/index.php)" = 644
          test "$(stat -c '%a' public/installer/index.php)" = 644
          echo "EXTRACTED_QA_CPANEL_PERMISSIONS_PASS"
          php tests/Installer/RootRoutingTest.php
          test ! -e .env
          test ! -e .git
          test ! -d node_modules
          php -S 127.0.0.1:8765 -t public > /tmp/barama-installer-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/barama-installer-http.log' EXIT
          python3 tests/Installer/InstallerHttpAcceptance.py
          php -r '
            $dbh=new PDO("mysql:host=127.0.0.1;dbname=barama_installer_qa;charset=utf8mb4","barama","ci_installer_password");
            $user=$dbh->query("SELECT email,system_role FROM users LIMIT 1")->fetch(PDO::FETCH_ASSOC);
            if (!$user || $user["email"]!=="installer-test@example.invalid" || $user["system_role"]!=="super_admin") { exit(1); }
            echo "INSTALLER_DATABASE_ADMIN_PASS\n";
          '

      - name: Integrated application feature tests FROM installed package
        run: |
          set -Eeuo pipefail
          cd /tmp/barama-qa-extracted/Barama-Laravel-Integrated-QA
          APP_ENV=testing APP_DEBUG=false DB_CONNECTION=sqlite DB_DATABASE=:memory: \
            SESSION_DRIVER=array CACHE_STORE=array composer test
      - name: Publish tested QA archive (not production-ready)
        uses: actions/upload-artifact@v4
        with:
          name: barama-laravel-integrated-qa
          path: |
            dist/Barama-Laravel-Integrated-QA.zip
            dist/Barama-Laravel-Integrated-QA.zip.sha256
            dist/Barama-Installer-Routing-Hotfix.zip
            dist/Barama-Installer-Routing-Hotfix.zip.sha256
            dist/Barama-Laravel-cPanel-PostInstall-Upgrade.zip
            dist/Barama-Laravel-cPanel-PostInstall-Upgrade.zip.sha256
            dist/Barama-Laravel-MediaLibrary-QA-Upgrade.zip
            dist/Barama-Laravel-MediaLibrary-QA-Upgrade.zip.sha256
            dist/Barama-Laravel-PolicyCenter-QA-Upgrade.zip
            dist/Barama-Laravel-PolicyCenter-QA-Upgrade.zip.sha256
            dist/Barama-Laravel-Customer-Admin-Frontend-QA-Upgrade.zip
            dist/Barama-Laravel-Customer-Admin-Frontend-QA-Upgrade.zip.sha256
            dist/Barama-Laravel-Dashboard-Viewing-QA-Upgrade.zip
            dist/Barama-Laravel-Dashboard-Viewing-QA-Upgrade.zip.sha256
            dist/Barama-Laravel-Catalog-Moderation-QA-Upgrade.zip
            dist/Barama-Laravel-Catalog-Moderation-QA-Upgrade.zip.sha256
            dist/Barama-Laravel-Appearance-QA-Upgrade.zip
            dist/Barama-Laravel-Appearance-QA-Upgrade.zip.sha256
          if-no-files-found: error
          retention-days: 7
