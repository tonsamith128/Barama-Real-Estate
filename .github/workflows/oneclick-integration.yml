name: One-click Updater Integration
on:
  pull_request:
    branches:
      - feature/one-click-updater-secure-trust-plan-20261020
  push:
    branches:
      - feature/one-click-updater-integration-20261020
permissions:
  contents: read
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l application/app/Services/Updates/OneClickUpdateQueueV1.php
          php -l application/app/Services/Updates/TrustedReleaseFeed.php
          php -l application/bin/oneclick-unprivileged-delivery.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l application/routes/web.php
          php -l application/resources/views/workspace/system-center.php
      - name: Updater web boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          routes=Path('application/routes/web.php').read_text()
          ctl=Path('application/app/Http/Controllers/SystemCenterController.php').read_text()
          queue=Path('application/app/Services/Updates/OneClickUpdateQueueV1.php').read_text()
          html=Path('application/resources/views/workspace/system-center.php').read_text()
          assert routes.count("/dashboard/system/auto-updater/update-now'")==1
          assert routes.count("/dashboard/system/auto-updater/status'")==1
          assert "new CsrfMiddleware()" in next(l for l in routes.splitlines() if "/dashboard/system/auto-updater/update-now'" in l)
          assert "hasRole('administrator')" in ctl and "hasRole('super-administrator')" in ctl
          assert "TrustedReleaseFeed::check" in ctl
          assert "publisher_authenticated_v2" in queue
          # Regression: literal escaped comment separators must not comment out
          # the queue path assignment while still passing PHP syntax.
          assert r'worker.\n        // A web-user-staged ZIP' not in queue
          assert r'update.\n        $dir=' not in queue
          assert queue.count('$dir=self::directory($site,true);') == 1
          assert any(l.strip()=='$dir=self::directory($site,true);' for l in queue.splitlines())
          assert "StagingPublisherCandidateV1::inspect" not in queue
          downloader=Path('application/bin/oneclick-unprivileged-delivery.php').read_text()
          assert "posix_geteuid() === 0" in downloader
          assert "PHP_SAPI !== 'cli'" in downloader
          assert "TrustedReleaseFeed::check" in downloader
          assert "verifyEnvelope" not in downloader or "hash_file" in downloader
          assert "https://tonsamith.com/license/v2/update/artifact" in downloader
          assert "CURLOPT_SSL_VERIFYPEER => true" in downloader
          assert "oneclick-delivery" in downloader
          assert "INSTALL_VERSION" not in downloader
          assert "protectedSignal(" in queue and "PublisherTrustPaths::protectedDirectoryReady()" in queue
          assert "authorized_to_install'=>false" in queue
          assert "hash_equals($jobId, $r['job_id'])" in queue
          assert "status(string $site, ?string $jobId = null)" in queue
          assert ctl.count("$_SESSION['_barama_oneclick_job_id'] ?? null") == 2
          assert ctl.count("is_string($jobId) ? $jobId : null") == 2
          assert "empty($systemOneClickWorkerReady)" in html
          assert "One-click Update" in html

          print('ONECLICK_WEB_BOUNDARY=PASS')
          PY

      - name: Read-only dashboard progress and fail-closed customer boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check assets/js/barama-oneclick-status-v100.js
          node --test tests/security/OneClickDashboardStatusTest.cjs
          python3 - <<'PY'
          from pathlib import Path
          queue = Path('application/app/Services/Updates/OneClickUpdateQueueV1.php').read_text()
          downloader = Path('application/bin/oneclick-unprivileged-delivery.php').read_text()
          view = Path('application/resources/views/workspace/system-center.php').read_text()
          assert "private const SITE='/www/wwwroot/baramastaging.tonsamith.com'" in queue
          assert "$root = '/www/wwwroot/baramastaging.tonsamith.com'" in downloader
          assert "ONECLICK_STAGING_WEB_ONLY" in queue
          assert "ONECLICK_TRUSTED_WORKER_NOT_READY" in queue
          assert "data-oneclick-stage-message" in view
          assert "data-oneclick-initial-state" in view
          assert "?v=102" in view
          print('STAGING_WORKER_BOUNDARY=STILL_FAIL_CLOSED_FOR_CUSTOMERS')
          PY

      - name: Portable worker profile contract (candidate-only, no installation)
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests -p test_portable_profile.py -v
          python3 - <<'PY'
          from pathlib import Path
          profile=Path('tools/oneclick/portable_profile.py').read_text()
          queue=Path('application/app/Services/Updates/OneClickUpdateQueueV1.php').read_text()
          delivery=Path('application/bin/oneclick-unprivileged-delivery.php').read_text()
          assert "auto_install_enabled" in profile and "'PROFILE_INSTALL_MUST_STAY_DISABLED'" in profile
          assert "managed_vps_candidate" in profile
          assert "def read_profile(profile_id" in profile
          assert "STAGING_PROFILE_FORBIDDEN" in profile
          assert "private const SITE='/www/wwwroot/baramastaging.tonsamith.com'" in queue
          assert "$root = '/www/wwwroot/baramastaging.tonsamith.com'" in delivery
          print('CUSTOMER_PORTABLE_PROFILE=FAIL_CLOSED_CANDIDATE_ONLY')
          PY
