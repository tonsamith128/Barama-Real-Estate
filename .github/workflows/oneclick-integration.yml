name: One-click Updater Integration
on:
  pull_request:
    branches:
      - feature/one-click-updater-secure-trust-plan-20261020
  push:
    branches:
      - feature/one-click-updater-integration-20261020
permissions:
  contents: read
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -Eeuo pipefail
          php -l application/app/Services/Updates/OneClickUpdateQueueV1.php
          php -l application/app/Services/Updates/PublisherPrivateDeliveryV1.php
          php -l application/bin/oneclick-publisher-delivery.php
          php -l application/app/Http/Controllers/SystemCenterController.php
          php -l application/routes/web.php
          php -l application/resources/views/workspace/system-center.php
      - name: Updater web boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          routes=Path('application/routes/web.php').read_text()
          ctl=Path('application/app/Http/Controllers/SystemCenterController.php').read_text()
          queue=Path('application/app/Services/Updates/OneClickUpdateQueueV1.php').read_text()
          html=Path('application/resources/views/workspace/system-center.php').read_text()
          assert routes.count("/dashboard/system/auto-updater/update-now'")==1
          assert routes.count("/dashboard/system/auto-updater/status'")==1
          assert "new CsrfMiddleware()" in next(l for l in routes.splitlines() if "/dashboard/system/auto-updater/update-now'" in l)
          assert "hasRole('administrator')" in ctl and "hasRole('super-administrator')" in ctl
          assert "TrustedReleaseFeed::check" in ctl and "StagingPublisherCandidateV1::inspect" in queue
          assert "protectedSignal(" in queue and "PublisherTrustPaths::protectedDirectoryReady()" in queue
          assert "authorized_to_install'=>false" in queue
          assert "empty($systemOneClickWorkerReady)" in html
          assert "One-click Update" in html
          delivery=Path('application/bin/oneclick-publisher-delivery.php').read_text()
          private_download=Path('application/app/Services/Updates/PublisherPrivateDeliveryV1.php').read_text()
          assert "posix_geteuid() !== 0" in delivery
          assert "PHP_SAPI !== 'cli'" in delivery
          assert "PublisherPrivateDeliveryV1::download" in delivery
          assert "oneclick-publisher-delivery" in delivery or "private-delivery-v1" in delivery
          assert "signed_envelope" in private_download
          assert "INSTALLATION_EXECUTED" not in delivery
          print('ONECLICK_PRIVATE_DELIVERY_BOUNDARY=PASS')
          print('ONECLICK_WEB_BOUNDARY=PASS')
          PY
