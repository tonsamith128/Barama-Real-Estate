name: Auto Updater Visible Layout V103
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/auto-updater-visible-layout-20261022]
permissions:
  contents: read
jobs:
  visible-layout-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check new asset paths, PHP syntax, browser JS
        run: |
          set -Eeuo pipefail
          php -l application/resources/views/workspace/auto-updater-unified-v100.php
          node --check assets/js/barama-auto-updater-experience-v103.js
          python3 - <<'PY'
          from pathlib import Path
          f=Path('application/resources/views/workspace/auto-updater-unified-v100.php').read_text()
          assert f.index('class="bau-columns"') < f.index('class="bau-versions"') < f.index('class="bau-readiness"') < f.index('class="bau-panel bau-bottom"')
          assert 'bau-feedback-stack bau-feedback-v103' in f
          assert 'class="bau-button bau-license-action"' in f
          assert "asset('css/barama-auto-updater-experience-v103.css')" in f
          assert "asset('js/barama-auto-updater-experience-v103.js')" in f
          assert "asset('css/barama-auto-updater-theme-v101.css') . '?v=103'" in f
          assert "asset('js/barama-auto-updater-unified-v100.js') . '?v=103'" in f
          assert "data-bau-check-form" in f and "data-bau-install-form" in f
          assert 'portable-update-now' in f
          print('SERVER_RENDERED_LIFECYCLE_FIRST=PASS')
          print('NOTIFICATION_POPUP=PASS')
          print('NEW_UNCACHED_ASSET_URLS=PASS')
          print('PERMISSION_AND_INSTALL_HANDLERS_PRESERVED=PASS')
          PY
