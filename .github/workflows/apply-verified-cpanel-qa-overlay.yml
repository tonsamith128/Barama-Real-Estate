name: Import verified cPanel QA package to release branch
on:
  push:
    branches:
      - release/barama-v100-tested-stable-assets-invoice-users-20261029
    paths:
      - '_migration/qa-overlay-parts/**'
permissions:
  contents: write
jobs:
  apply-reviewed-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exact tested file snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, re, shutil, subprocess, zipfile
          root=pathlib.Path('.')
          base=root/'_migration/qa-overlay-parts'
          parts=sorted(base.glob('part*.b64'))
          assert len(parts)==8, f'Expected eight payload parts, got {len(parts)}'
          archive=base64.b64decode(''.join(f.read_text().strip() for f in parts),validate=True)
          actual_sha=hashlib.sha256(archive).hexdigest()
          assert actual_sha=='c479fc67764ae91498df0ecec318e4dd8ab48e89862594f17b241bcb00fc4ea0',f'Archive checksum mismatch: {actual_sha}'
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert z.testzip() is None
              m=json.loads(z.read('manifest.json'))
              assert len(m['files'])==83 and len(m['remove_assets'])==224
              for row in m['files']:
                  name=row['path']
                  assert name in {'README.md','CUSTOMER_PACKAGE.md'} or name.startswith(('application/','assets/')),name
                  assert '..' not in pathlib.PurePosixPath(name).parts,name
                  contents=z.read('payload/'+name)
                  assert hashlib.sha256(contents).hexdigest()==row['sha256'],name
                  destination=root/name
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  destination.write_bytes(contents)
              for name in m['remove_assets']:
                  assert re.fullmatch(r'assets/(?:css|js)/[A-Za-z0-9_./-]+\.(?:css|js)',name),name
                  file=root/name
                  if file.exists():
                      assert file.is_file() and not file.is_symlink(),name
                      file.unlink()
          required=[f'assets/{kind}/{area}.{kind}' for kind in ('css','js') for area in ('admin','frontend','developer','account','policy-center')]
          for name in required:assert (root/name).is_file(),name
          # All direct PHP CSS/JS asset references must resolve after removing legacy files.
          missing=[]
          for p in (root/'application').rglob('*.php'):
              source=p.read_text(encoding='utf-8',errors='replace')
              for name in re.findall(r'asset\([\'\"]((?:css|js)/[^\'\"]+\.(?:css|js))[\'\"]\)',source):
                  if not (root/'assets'/name).exists():missing.append((str(p),name))
          if missing:raise RuntimeError('Missing PHP asset references: '+repr(missing[:20]))
          for p in (root/'assets/js').rglob('*.js'):
              subprocess.run(['node','--check',str(p)],check=True,stdout=subprocess.DEVNULL)
          php=[p for p in (root/'application').rglob('*.php')]
          php+=list((root/'installer').glob('*.php'))
          php+=list((root/'updater').glob('*.php'))
          php.append(root/'index.php')
          for p in php:
              subprocess.run(['php','-l',str(p)],check=True,stdout=subprocess.DEVNULL)
          print('QA_PAYLOAD_CHECK=PASS')
          print('UPDATED_FILES=83')
          print('OLD_CSS_JS_REMOVED=224')
          print('REQUIRED_STABLE_BUNDLES=10')
          print('REFERENCES=PASS')
          print('NODE_PARSE=PASS')
          print('PHP_LINT=PASS',len(php))
          shutil.rmtree(base)
          PY
      - name: Commit exact tested application and discard bridge and one-time workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets application README.md CUSTOMER_PACKAGE.md _migration
          git rm --ignore-unmatch .github/workflows/apply-verified-cpanel-qa-overlay.yml
          git commit -m "Sync QA-tested v1.0.0 stable asset release and verified invoice/users fixes"
          git push origin HEAD:release/barama-v100-tested-stable-assets-invoice-users-20261029
