<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" fill="none">
  <defs>
    <linearGradient id="shieldGold" x1="438" y1="106" x2="790" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE0A0" stop-opacity=".98"/>
      <stop offset=".46" stop-color="#E5B65E" stop-opacity=".88"/>
      <stop offset="1" stop-color="#C68A2D" stop-opacity=".62"/>
    </linearGradient>
    <radialGradient id="haloGold" cx="0" cy="0" r="1"
      gradientTransform="translate(626 305) rotate(90) scale(268 330)"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9A84E" stop-opacity=".22"/>
      <stop offset=".56" stop-color="#D9A84E" stop-opacity=".08"/>
      <stop offset="1" stop-color="#D9A84E" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-28%" y="-28%" width="156%" height="156%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <ellipse cx="630" cy="306" rx="286" ry="242"
