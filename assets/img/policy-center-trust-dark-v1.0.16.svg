    opacity="1" filter="url(#lineGlow)"/>

  <g opacity=".42" stroke="#D4A247" stroke-width="2.5">
    <circle cx="615" cy="301" r="206"/>
    <circle cx="615" cy="301" r="164"/>
    <circle cx="615" cy="301" r="122"/>
  </g>

  <g opacity=".56" fill="#E0AE51">
